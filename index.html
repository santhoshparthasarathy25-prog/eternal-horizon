<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061426">
<title>Eternal Horizon — Living Sky</title>
<style>
:root{color-scheme:dark;--panel:rgba(5,15,29,.76);--line:rgba(255,255,255,.16);--text:#f5f8ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020713;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,4,13,.28) 100%);z-index:1}
.topbar{position:fixed;z-index:3;top:22px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none}
.brand{pointer-events:auto;text-shadow:0 2px 20px #0008}.brand h1{font-size:clamp(17px,2vw,25px);letter-spacing:.22em;margin:0;font-weight:650}.brand p{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#d6e4f4;margin:7px 0 0}
.pill{font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);background:#07162988;backdrop-filter:blur(14px);padding:9px 12px;border-radius:99px}
.panel{position:fixed;z-index:3;right:22px;top:90px;width:min(310px,calc(100vw - 32px));max-height:calc(100vh - 115px);overflow:auto;padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(20px);box-shadow:0 18px 60px #0004;transition:opacity .25s,transform .25s}
.panel.hidden{opacity:0;transform:translateX(18px);pointer-events:none}
.panel h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#b7c9df;margin:0 0 15px}
.control{margin:14px 0}.control label{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#e4edf8;margin-bottom:8px}.control output{color:#8ee7dc;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#64dccc}input[type=time],select{width:100%;background:#102238;color:#fff;border:1px solid #ffffff22;border-radius:9px;padding:9px;font:inherit}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
button{cursor:pointer;border:1px solid #ffffff25;background:#132b42;color:#f4fbff;padding:10px 11px;border-radius:10px;font-size:11px;font-weight:650;letter-spacing:.035em;transition:background .2s,transform .2s}
button:hover{background:#1b425a;transform:translateY(-1px)}button.primary{background:linear-gradient(120deg,#087d83,#13a899);border:0;color:#03171b}.wide{grid-column:1/-1}
.footer{position:fixed;z-index:2;bottom:19px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;text-shadow:0 2px 12px #000}.caption{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#e0eaf4}.clock{font-size:12px;font-variant-numeric:tabular-nums;color:#f6fbff}
.toast{position:fixed;z-index:5;left:50%;bottom:64px;transform:translateX(-50%);background:#071629ed;border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:600px){.topbar{top:15px;left:15px;right:15px}.panel{top:auto;bottom:57px;right:12px;width:min(285px,calc(100vw - 24px));max-height:58vh;padding:13px}.footer{left:15px;right:15px;bottom:14px}.brand h1{letter-spacing:.13em}.pill{font-size:9px;padding:7px 9px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Animated tropical horizon"></canvas>
<div class="vignette"></div>
<header class="topbar">
  <div class="brand"><h1>ETERNAL HORIZON</h1><p>A living sky • a quiet world</p></div>
  <div class="pill" id="phasePill">Blue hour</div>
</header>
<aside class="panel" id="panel">
  <h2>Atmosphere controls</h2>
  <div class="control"><label for="mode">Time mode</label><select id="mode"><option value="live">Use local time</option><option value="manual">Manual time</option><option value="cycle">Cinematic full cycle</option></select></div>
  <div class="control" id="manualWrap"><label for="time">Manual time <output id="timeOut">06:30</output></label><input id="time" type="range" min="0" max="1439" value="390"></div>
  <div class="control"><label for="speed">Animation speed <output id="speedOut">1.0×</output></label><input id="speed" type="range" min="0" max="3" value="1" step=".1"></div>
  <div class="control"><label for="stars">Star density <output id="starsOut">1.0×</output></label><input id="stars" type="range" min="0" max="2" value="1" step=".1"></div>
  <div class="control"><label for="waves">Ocean waves <output id="wavesOut">1.0×</output></label><input id="waves" type="range" min="0" max="2" value="1" step=".1"></div>
  <div class="control"><label for="quality">Rendering quality</label><select id="quality"><option value="1">Balanced</option><option value="1.5">High</option><option value="2">Ultra</option></select></div>
  <div class="actions">
    <button id="pause">Pause animation</button><button id="toggle">Hide controls</button>
    <button id="wallpaper" class="primary wide">Export 8K wallpaper · 7680 × 4320</button>
    <button id="reset" class="wide">Reset settings</button>
  </div>
  <p style="font-size:10px;line-height:1.6;color:#a8bbd0;margin:14px 0 0">8K export renders a separate 7680 × 4320 PNG. Rendering may take a little time on mobile devices.</p>
</aside>
<footer class="footer"><div class="caption" id="caption">Where the sky meets the sea</div><div class="clock" id="clock">06:30:00</div></footer>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('scene');let ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,paused=false,last=performance.now(),elapsed=0,manualMinutes=390,phase=0;
let speed=1,starDensity=1,waveStrength=1,quality=1,mode='live';
let stars=[],clouds=[],particles=[];
function randSeed(seed){let x=Math.sin(seed*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function makeSkyObjects(){
 stars=Array.from({length:500},(_,i)=>({x:randSeed(i+4),y:randSeed(i+903)*.73,r:.35+randSeed(i+11)*1.35,a:.25+randSeed(i+20)*.75,tw:randSeed(i+40)*6.28}));
 clouds=Array.from({length:12},(_,i)=>({x:randSeed(i+800)*1.4-.2,y:.12+randSeed(i+850)*.34,s:.4+randSeed(i+880)*1.4,a:.025+randSeed(i+890)*.045}));
 particles=Array.from({length:110},(_,i)=>({x:randSeed(i+1800),y:.57+randSeed(i+1900)*.4,s:.4+randSeed(i+2000)*1.4,a:.15+randSeed(i+2100)*.35}));
}
function resize(){
 const rect=canvas.getBoundingClientRect();W=Math.max(1,rect.width);H=Math.max(1,rect.height);
 DPR=Math.min(window.devicePixelRatio||1,Number(quality)*1.5);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
function mix(a,b,t){return a+(b-a)*t}
function smooth(a,b,x){let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)}
function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function color(hex){let n=parseInt(hex.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function blend(c1,c2,t){let a=color(c1),b=color(c2);return `rgb(${Math.round(mix(a[0],b[0],t))},${Math.round(mix(a[1],b[1],t))},${Math.round(mix(a[2],b[2],t))})`}
function getTime(){
 if(mode==='manual')return manualMinutes/1440;
 if(mode==='cycle')return (elapsed/100000)%1;
 const d=new Date();return (d.getHours()*60+d.getMinutes()+d.getSeconds()/60)/1440;
}
function getPalette(t){
 // t=0 midnight, .25 sunrise, .5 noon, .75 sunset
 const stops=[
 [0,'#020716','#071b35','#16354a','#06111e'],
 [.18,'#111b42','#5c5577','#d18b78','#142337'],
 [.25,'#416a9b','#f3b48d','#ffd5a1','#22536a'],
 [.34,'#71b9ed','#d8efff','#fff0ce','#198da4'],
 [.5,'#2389d0','#9ad7f4','#f8f6e9','#087f9b'],
 [.66,'#2d659a','#efb48f','#ffcf8c','#14576d'],
 [.75,'#351f50','#d66c59','#ff9c5d','#102d42'],
 [.84,'#111735','#584b70','#c77970','#0b1d30'],
 [1,'#020716','#071b35','#16354a','#06111e']
 ];
 let i=0;while(i<stops.length-1&&t>stops[i+1][0])i++;
 const a=stops[i],b=stops[Math.min(i+1,stops.length-1)],q=smooth(a[0],b[0],t);
 return {top:blend(a[1],b[1],q),mid:blend(a[2],b[2],q),horizon:blend(a[3],b[3],q),sea:blend(a[4],b[4],q),
 night:clamp(1-smooth(.19,.34,t))*(1-smooth(.77,.9,t))+smooth(.78,.94,t),day:smooth(.2,.34,t)*(1-smooth(.69,.82,t)),
 sunset:Math.max(smooth(.65,.76,t)*(1-smooth(.79,.86,t)),smooth(.19,.25,t)*(1-smooth(.29,.36,t)))};
}
function drawSky(t,p,time){
 let g=ctx.createLinearGradient(0,0,0,H*.72);g.addColorStop(0,p.top);g.addColorStop(.57,p.mid);g.addColorStop(1,p.horizon);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // Atmospheric glow around the sun's horizon
 const sunX=W*(.5+.34*Math.cos((t-.5)*Math.PI*2)),sunY=H*(.38-.28*Math.sin(t*Math.PI*2));
 let glow=ctx.createRadialGradient(sunX,sunY,1,sunX,sunY,Math.max(W,H)*.43);
 glow.addColorStop(0,`rgba(255,205,139,${.22+.22*p.day+.17*p.sunset})`);glow.addColorStop(.35,`rgba(255,130,100,${.08+.1*p.sunset})`);glow.addColorStop(1,'rgba(255,130,100,0)');
 ctx.fillStyle=glow;ctx.fillRect(0,0,W,H*.8);
 // Stars fade away during daylight
 const starAlpha=clamp((p.night-.08)*1.25)*starDensity;
 if(starAlpha>.01){for(const s of stars){let tw=.65+.35*Math.sin(elapsed*.0014+s.tw);ctx.globalAlpha=starAlpha*s.a*tw;ctx.fillStyle='#f3f8ff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();if(s.r>1.25){ctx.globalAlpha*=.45;ctx.fillRect(s.x*W-3,s.y*H,s.r*6,.45);ctx.fillRect(s.x*W,s.y*H-3,.45,s.r*6)}}ctx.globalAlpha=1}
 // Moon: opposite side from sun, crater detail
 const moonX=W*(.5-.34*Math.cos((t-.5)*Math.PI*2)),moonY=H*(.36+.25*Math.sin(t*Math.PI*2));
 if(p.night>.12){ctx.globalAlpha=p.night;let mg=ctx.createRadialGradient(moonX,moonY,1,moonX,moonY,38*W/1200);mg.addColorStop(0,'rgba(191,224,255,.22)');mg.addColorStop(1,'rgba(191,224,255,0)');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(moonX,moonY,38*W/1200,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f0f3f4';ctx.beginPath();ctx.arc(moonX,moonY,Math.max(7,W*.010),0,Math.PI*2);ctx.fill();ctx.fillStyle='#d5dfe8';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(moonX+(i-2)*W*.002,moonY+(i%2?1:-1)*W*.002,Math.max(1,W*.0008),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
 // Sun disc; it travels through the horizon and disappears below it
 const sunProgress=(t-.25)*Math.PI*2;
 const sx=W*(.5+.34*Math.cos(sunProgress)),sy=H*(.47-.39*Math.sin(sunProgress));
 const visible=clamp((H*.77-sy)/(H*.11));
 if(visible>.01&&p.day+p.sunset>.05){
 let r=Math.max(12,W*.021);let sg=ctx.createRadialGradient(sx,sy,r*.1,sx,sy,r*4);sg.addColorStop(0,`rgba(255,239,183,${.55*visible})`);sg.addColorStop(1,'rgba(255,180,100,0)');
 ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,r*4,0,Math.PI*2);ctx.fill();
 ctx.globalAlpha=visible;let disc=ctx.createLinearGradient(sx,sy-r,sx,sy+r);disc.addColorStop(0,'#fff9d9');disc.addColorStop(1,p.sunset>.4?'#ffb16c':'#fff1ba');ctx.fillStyle=disc;ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 }
 // Soft, high-altitude cloud bands
 for(const c of clouds){let x=((c.x+elapsed*.000003*c.s)%1.4-.2)*W,y=c.y*H;ctx.globalAlpha=c.a*(.45+p.day);ctx.fillStyle=p.day>.2?'#fff7ed':'#b3c4e2';ctx.beginPath();ctx.ellipse(x,y,W*.095*c.s,H*.009*c.s,0,0,Math.PI*2);ctx.ellipse(x+W*.04*c.s,y-H*.006*c.s,W*.06*c.s,H*.012*c.s,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 // Stylized aurora at night
 if(p.night>.55){ctx.save();ctx.globalAlpha=(p.night-.55)*.42;for(let band=0;band<4;band++){ctx.beginPath();for(let x=0;x<=W;x+=W/100){let y=H*(.19+band*.035)+Math.sin(x/W*8+elapsed*.00025+band)*H*.045+Math.sin(x/W*17-elapsed*.00018)*H*.018;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=band%2?'#31e9bd':'#52a7ff';ctx.lineWidth=H*.025;ctx.shadowBlur=30;ctx.shadowColor=ctx.strokeStyle;ctx.stroke()}ctx.restore()}
}
function drawOcean(t,p){
 const y=H*.68;let g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,p.sea);g.addColorStop(.45,blend(p.sea,'#05263a',.4));g.addColorStop(1,'#020b17');ctx.fillStyle=g;ctx.fillRect(0,y,W,H-y);
 // distant horizon haze
 let hz=ctx.createLinearGradient(0,y-H*.05,0,y+H*.12);hz.addColorStop(0,'rgba(255,219,174,0)');hz.addColorStop(.5,`rgba(255,205,158,${.13+.15*p.sunset})`);hz.addColorStop(1,'rgba(255,219,174,0)');ctx.fillStyle=hz;ctx.fillRect(0,y-H*.05,W,H*.17);
 // Sun/moon path reflection
 const sunX=W*(.5+.34*Math.cos((t-.25)*Math.PI*2)),reflectionAlpha=.16+.25*p.sunset+.12*p.day;
 let rg=ctx.createLinearGradient(sunX, y, sunX, H);rg.addColorStop(0,`rgba(255,222,168,${reflectionAlpha})`);rg.addColorStop(1,'rgba(255,195,130,0)');
 ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(sunX-W*.015,y);ctx.lineTo(sunX+W*.015,y);ctx.lineTo(sunX+W*.12,H);ctx.lineTo(sunX-W*.12,H);ctx.closePath();ctx.fill();
 // layered perspective wave lines
 for(let layer=0;layer<40;layer++){
  let z=layer/40,yy=y+z*z*(H-y),alpha=(.04+z*.17)*waveStrength;
  ctx.beginPath();for(let x=0;x<=W+5;x+=Math.max(8,W/110)){let wav=Math.sin(x/W*24+elapsed*.001*(.5+z)*waveStrength+layer)*H*(.001+z*.003);if(x===0)ctx.moveTo(x,yy+wav);else ctx.lineTo(x,yy+wav)}
  ctx.strokeStyle=`rgba(${p.day>.3?'190,235,244':'110,166,203'},${alpha})`;ctx.lineWidth=.45+z*1.1;ctx.stroke();
 }
 // small glitter flecks
 for(const q of particles){let yy=q.y*H,xx=((q.x+elapsed*.00002*waveStrength)%1)*W;ctx.globalAlpha=q.a*waveStrength*(.3+p.day);ctx.fillStyle='#d7f7ff';ctx.fillRect(xx,yy,2+q.s*2,.7+q.s*.25)}ctx.globalAlpha=1;
}
function palm(x,y,size,lean,night){
 ctx.save();ctx.translate(x,y);ctx.scale(size,size);
 // trunk
 ctx.strokeStyle=blend('#61452f','#111c27',night*.75);ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(lean*.15,-35,lean*.85,-78,lean,-120);ctx.stroke();
 for(let i=0;i<8;i++){let yy=-14-i*12;ctx.strokeStyle=`rgba(24,25,28,${.18+i*.025})`;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(lean*(i/8),yy);ctx.lineTo(lean*(i/8)-5,yy-7);ctx.stroke()}
 let tx=lean,ty=-120;for(let i=0;i<9;i++){let a=Math.PI*2*i/9+Math.sin(elapsed*.0005+i)*.04;let len=38+(i%3)*8;ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo(tx+Math.cos(a)*len*.48,ty+Math.sin(a)*len*.42-9,tx+Math.cos(a)*len,ty+Math.sin(a)*len*.75+10);ctx.quadraticCurveTo(tx+Math.cos(a)*len*.58,ty+Math.sin(a)*len*.45+8,tx,ty);ctx.fillStyle=blend('#174c3d','#071a22',night*.9);ctx.fill();ctx.strokeStyle=blend('#4c8c62','#102a29',night);ctx.lineWidth=.8;ctx.stroke()}ctx.restore();
}
function drawIsland(p){
 const y=H*.71;
 // distant island silhouettes
 ctx.fillStyle=blend('#264b51','#06151f',p.night);ctx.beginPath();ctx.moveTo(0,y+H*.005);ctx.quadraticCurveTo(W*.1,y-H*.018,W*.19,y-H*.006);ctx.quadraticCurveTo(W*.24,y-H*.028,W*.31,y);ctx.quadraticCurveTo(W*.42,y-H*.009,W*.48,y);ctx.lineTo(0,y+H*.02);ctx.fill();
 // near sandy beach entering from right
 ctx.beginPath();ctx.moveTo(W*.62,H);ctx.quadraticCurveTo(W*.76,H*.86,W*.79,H*.75);ctx.quadraticCurveTo(W*.84,H*.72,W*.9,H*.75);ctx.quadraticCurveTo(W*.95,H*.78,W,H*.74);ctx.lineTo(W,H);ctx.closePath();
 let sand=ctx.createLinearGradient(0,H*.72,0,H);sand.addColorStop(0,blend('#e7d6a6','#6d6259',p.night));sand.addColorStop(.42,blend('#d9bd88','#343c43',p.night));sand.addColorStop(1,blend('#8f7657','#151f2a',p.night));ctx.fillStyle=sand;ctx.fill();
 // wet shoreline highlight
 ctx.beginPath();ctx.moveTo(W*.61,H);ctx.quadraticCurveTo(W*.73,H*.87,W*.79,H*.75);ctx.quadraticCurveTo(W*.83,H*.73,W*.88,H*.76);ctx.strokeStyle=`rgba(255,241,203,${.25+.25*p.day})`;ctx.lineWidth=Math.max(2,H*.003);ctx.stroke();
 // beach shadow and rocks
 for(let i=0;i<34;i++){let x=W*(.79+randSeed(i+77)*.2),y=H*(.81+randSeed(i+90)*.17),r=W*(.001+randSeed(i+100)*.004);ctx.fillStyle=blend('#4c4a42','#0b1720',p.night);ctx.beginPath();ctx.ellipse(x,y,r*1.8,r,randSeed(i)*2,0,Math.PI*2);ctx.fill()}
 // palms framing the horizon
 palm(W*.87,H*.82,H*.0042,-4,p.night);palm(W*.94,H*.8,H*.0033,5,p.night);palm(W*.79,H*.83,H*.0025,1,p.night);
 // foreground grass blades
 for(let i=0;i<45;i++){let x=W*(.78+randSeed(i+500)*.22),y=H*(.9+randSeed(i+510)*.09);ctx.strokeStyle=blend('#49674a','#101f25',p.night);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-5,y-8,x+(randSeed(i+520)-.5)*18,y-15-randSeed(i+530)*14);ctx.stroke()}
}
function render(t){
 const p=getPalette(t);ctx.clearRect(0,0,W,H);drawSky(t,p);drawOcean(t,p);drawIsland(p);
 $('phasePill').textContent=t<.19?'Midnight':t<.23?'Pre-dawn':t<.31?'Sunrise':t<.43?'Morning':t<.61?'Daylight':t<.7?'Golden hour':t<.8?'Sunset':'Twilight';
 $('caption').textContent=t<.2?'A quiet world beneath the stars':t<.33?'The horizon awakens':t<.62?'Where sunlight meets the sea':t<.81?'Chasing the last light':'Night returns to the ocean';
 const mins=Math.floor(t*1440),hh=String(Math.floor(mins/60)%24).padStart(2,'0'),mm=String(mins%60).padStart(2,'0'),ss=String(Math.floor(elapsed/1000)%60).padStart(2,'0');
 $('clock').textContent=`${hh}:${mm}:${ss}`;
}
function loop(now){let dt=Math.min(50,now-last);last=now;if(!paused){elapsed+=dt*speed;if(mode==='cycle'){} }const t=getTime();render(t);requestAnimationFrame(loop)}
function updateLabels(){$('timeOut').textContent=String(Math.floor(manualMinutes/60)).padStart(2,'0')+':'+String(manualMinutes%60).padStart(2,'0');$('speedOut').textContent=Number(speed).toFixed(1)+'×';$('starsOut').textContent=Number(starDensity).toFixed(1)+'×';$('wavesOut').textContent=Number(waveStrength).toFixed(1)+'×'}
$('mode').addEventListener('change',e=>{mode=e.target.value;$('manualWrap').style.display=mode==='manual'?'block':'none';if(mode==='cycle')elapsed=0});
$('time').addEventListener('input',e=>{manualMinutes=Number(e.target.value);updateLabels()});
$('speed').addEventListener('input',e=>{speed=Number(e.target.value);updateLabels()});
$('stars').addEventListener('input',e=>{starDensity=Number(e.target.value);updateLabels()});
$('waves').addEventListener('input',e=>{waveStrength=Number(e.target.value);updateLabels()});
$('quality').addEventListener('change',e=>{quality=Number(e.target.value);resize()});
$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'Resume animation':'Pause animation'});
$('toggle').addEventListener('click',()=>{$('panel').classList.toggle('hidden');$('toggle').textContent=$('panel').classList.contains('hidden')?'Show controls':'Hide controls'});
$('reset').addEventListener('click',()=>{mode='live';speed=1;starDensity=1;waveStrength=1;quality=1;manualMinutes=390;paused=false;$('mode').value='live';$('time').value=390;$('speed').value=1;$('stars').value=1;$('waves').value=1;$('quality').value='1';$('pause').textContent='Pause animation';$('manualWrap').style.display='none';updateLabels();resize()});
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3200)}
$('wallpaper').addEventListener('click',()=>{
 const btn=$('wallpaper');btn.disabled=true;btn.textContent='Rendering 8K…';
 setTimeout(()=>{
  try{
