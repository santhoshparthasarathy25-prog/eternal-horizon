<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Eternal Horizon</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#fff;font-family:system-ui,Arial,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;background:#07101ecc;padding:8px 12px;border-radius:10px;font-size:12px;text-align:center;max-width:90vw}
#setup{position:fixed;z-index:3;bottom:18px;left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 24px));padding:16px;background:#07101ef2;border:1px solid #38bdf866;border-radius:16px;text-align:center}
#setup h2{margin:0 0 8px;color:#7dd3fc}
#setup p{font-size:12px;line-height:1.5;color:#cbd5e1}
button,select{font:inherit}
button{background:#087db8;color:white;border:0;border-radius:10px;padding:10px 12px;cursor:pointer}
button.secondary{background:transparent;color:#cbd5e1}
#setup button{width:100%;margin:4px 0}
#panel{display:none;position:fixed;z-index:4;top:12px;right:12px;width:min(350px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;padding:15px;border:1px solid #38bdf866;border-radius:16px;background:#07101ef5;box-shadow:0 12px 36px #0009}
#panel.open{display:block}
.heading{font-weight:800;color:#7dd3fc}
.muted{font-size:12px;color:#b6c5d7;line-height:1.5}
.row{margin:12px 0}
.row label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
input[type=range]{width:100%;accent-color:#38bdf8}
select{width:100%;padding:8px;background:#1e293b;color:white;border:1px solid #475569;border-radius:8px}
#status{font-size:11px;color:#a7f3d0;overflow-wrap:anywhere;line-height:1.5}
#photoInput{display:none}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="hint">Double-tap the screen to open settings</div>

<section id="setup">
  <h2>Eternal Horizon</h2>
  <p>Your animated tropical night beach. Tap below to start the generated scene. Reference photos are optional.</p>
  <button id="start">Start Eternal Horizon</button>
  <button id="choosePhotos" class="secondary">Choose 2 reference photos</button>
  <input id="photoInput" type="file" accept="image/*" multiple>
</section>

<section id="panel">
  <div class="heading">ETERNAL HORIZON</div>
  <p class="muted">Double-tap outside this panel to close settings.</p>
  <div id="status" class="row">Starting graphics…</div>

  <div class="row">
    <label><span>Use local time</span><input id="realTime" type="checkbox" checked></label>
  </div>
  <div class="row">
    <label><span>Manual time</span><span id="timeLabel">22:00</span></label>
    <input id="time" type="range" min="0" max="23.99" step=".02" value="22">
  </div>
  <div class="row">
    <label><span>Animation speed</span><span id="speedLabel">1×</span></label>
    <input id="speed" type="range" min="0" max="5" step=".1" value="1">
  </div>
  <div class="row">
    <label><span>Pause animation</span><input id="paused" type="checkbox"></label>
  </div>
  <div class="row">
    <label><span>Star density</span><span id="starsLabel">1.0</span></label>
    <input id="stars" type="range" min="0" max="2" step=".1" value="1">
  </div>
  <div class="row">
    <label><span>Ocean waves</span><span id="wavesLabel">1.0</span></label>
    <input id="waves" type="range" min="0" max="2" step=".1" value="1">
  </div>
  <div class="row">
    <label><span>Moon phase</span><span id="phaseLabel">0.35</span></label>
    <input id="phase" type="range" min="0" max="1" step=".01" value=".35">
  </div>
  <div class="row">
    <label><span>Rendering quality</span></label>
    <select id="quality">
      <option value=".55">Battery saver</option>
      <option value=".8" selected>Balanced</option>
      <option value="1">High</option>
    </select>
  </div>
  <button id="changePhotos">Choose reference photos</button>
</section>

<script>
(() => {
"use strict";

const canvas = document.getElementById("scene");
const gl = canvas.getContext("webgl2", {
  alpha: false,
  antialias: false,
  powerPreference: "default"
});
const $ = id => document.getElementById(id);

let program;
let lastTime = 0;
let elapsed = 0;
let lastTap = 0;
let textures = [];
let photoCount = 0;
let failed = false;

const vertexShader = `#version 300 es
in vec2 aPosition;
out vec2 vUv;
void main(){
  vUv = aPosition * 0.5 + 0.5;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const fragmentShader = `#version 300 es
precision highp float;

in vec2 vUv;
out vec4 fragColor;

uniform vec2 uResolution;
uniform float uTime;
uniform float uHour;
uniform float uStars;
uniform float uWaves;
uniform float uPhase;
uniform sampler2D uBeach;
uniform sampler2D uGalaxy;
uniform float uHasPhotos;

float hash(vec2 p){
  p = fract(p * vec2(123.34,456.21));
  p += dot(p,p+45.32);
  return fract(p.x*p.y);
}

float noise(vec2 p){
  vec2 i=floor(p);
  vec2 f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i);
  float b=hash(i+vec2(1.0,0.0));
  float c=hash(i+vec2(0.0,1.0));
  float d=hash(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}

void main(){
  vec2 uv=vUv;
  float aspect=uResolution.x/max(uResolution.y,1.0);
  float horizon=0.47;

  float day=clamp((sin((uHour-6.0)*3.14159265/12.0)+0.12)*0.65,0.0,1.0);
  float night=1.0-day;

  float skyHeight=clamp((uv.y-horizon)/(1.0-horizon),0.0,1.0);

  vec3 sky=mix(
    vec3(0.008,0.018,0.065),
    vec3(0.025,0.12,0.24),
    pow(skyHeight,0.8)
  );

  vec3 daylight=mix(
    vec3(0.95,0.40,0.22),
    vec3(0.25,0.60,0.85),
    skyHeight
  );

  float dawn=clamp(1.0-abs(uHour-6.0)/2.0,0.0,1.0);
  float dusk=clamp(1.0-abs(uHour-18.0)/2.0,0.0,1.0);
  sky=mix(sky,daylight,(dawn+dusk)*0.85);
  sky=mix(sky,vec3(0.22,0.48,0.68),day*0.9);

  float water=1.0-smoothstep(horizon-0.003,horizon+0.003,uv.y);
  float sandLine=0.30+(horizon-uv.y)*1.1;

  vec3 sand=mix(
    vec3(0.32,0.25,0.19),
    vec3(0.12,0.16,0.17),
    smoothstep(0.0,0.8,uv.y)
  );

  vec3 ocean=mix(
    vec3(0.006,0.035,0.075),
    vec3(0.015,0.17,0.22),
    clamp((horizon-uv.y)*2.0,0.0,1.0)
  );

  vec3 col=uv.y>horizon?sky:mix(ocean,sand,step(sandLine,uv.x));

  // Optional photos are used only when two valid images are loaded.
  if(uHasPhotos>0.5){
    vec2 texUv=clamp(vec2(uv.x,1.0-uv.y),vec2(0.002),vec2(0.998));
    vec3 beach=texture(uBeach,texUv).rgb;
    vec3 galaxy=texture(uGalaxy,texUv).rgb;
    float skyMask=smoothstep(horizon-0.02,horizon+0.04,uv.y);
    col=mix(col,beach,0.55);
    col=mix(col,galaxy,skyMask*night*0.45);
  }

  // Stars.
  vec2 grid=floor(uv*vec2(180.0,320.0));
  float star=hash(grid);
  float twinkle=0.65+0.35*sin(uTime*2.0+star*90.0);
  if(star>0.992 && uv.y>horizon){
    col+=vec3(0.72,0.83,1.0)*uStars*night*twinkle;
  }

  // Moon.
  vec2 moonPos=vec2(0.73,0.73);
  vec2 md=(uv-moonPos)*vec2(aspect,1.0);
  float radius=length(md);
  float moonMask=1.0-smoothstep(0.025,0.029,radius);

  float phaseShift=(uPhase-0.5)*0.05;
  float lit=step(md.x,phaseShift);
  vec3 moonColor=vec3(0.83,0.87,0.92)*(0.35+0.65*lit);
  col=mix(col,moonColor,moonMask*night);

  // Ocean ripples and reflected light.
  if(water>0.5){
    float wave=sin(uv.y*180.0+uTime*2.0+sin(uv.x*32.0)*2.0);
    float ripple=smoothstep(0.45,0.95,wave*0.5+0.5);
    col+=vec3(0.04,0.19,0.23)*ripple*uWaves;

    float reflection=exp(-pow((uv.x-0.73)/(0.018+(horizon-uv.y)*0.20),2.0));
    col+=vec3(0.62,0.69,0.60)*reflection*night*0.25*uWaves;
  }

  // Palm trunk: boolean condition converted to a float correctly.
  float px=(uv.x-0.82)+0.09*(uv.y-0.65);
  float trunk=(
    abs(px-0.025*sin((0.78-uv.y)*5.0))<0.009
    && uv.y<0.73
    && uv.y>0.27
  )?1.0:0.0;

  // Palm fronds.
  float leaves=0.0;
  for(int i=0;i<6;i++){
    float fi=float(i);
    float angle=fi*0.42-1.05;
    vec2 p=uv-vec2(0.82,0.71);
    float curve=0.71+angle*p.x+0.10*sin(p.x*8.0+fi);
    float distanceToLeaf=abs(p.y-curve);
    float shape=1.0-smoothstep(0.003,0.014,distanceToLeaf);
    float reach=step(0.0,0.20-abs(p.x));
    leaves=max(leaves,shape*reach);
  }

  col=mix(col,vec3(0.004,0.012,0.015),max(trunk,leaves*0.85));

  // Gentle horizon glow.
  float glow=exp(-abs(uv.y-horizon)*30.0);
  col+=vec3(0.035,0.09,0.12)*glow;

  // Vignette.
  vec2 centered=uv-0.5;
  float vignette=1.0-0.25*dot(centered,centered);
  col*=vignette;

  col=col/(1.0+col*0.2);
  fragColor=vec4(clamp(col,0.0,1.0),1.0);
}`;

function compileShader(type, source){
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);
  gl.compileShader(shader);

  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
    const error=gl.getShaderInfoLog(shader)||"Unknown shader compilation error";
    gl.deleteShader(shader);
    throw new Error(error);
  }
  return shader;
}

function makeTexture(){
  const texture=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texImage2D(
    gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,
    new Uint8Array([12,20,35,255])
  );
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return texture;
}

function init(){
  if(!gl) throw new Error("WebGL2 is not available in this browser.");

  const vs=compileShader(gl.VERTEX_SHADER,vertexShader);
  const fs=compileShader(gl.FRAGMENT_SHADER,fragmentShader);

  program=gl.createProgram();
  gl.attachShader(program,vs);
  gl.attachShader(program,fs);
  gl.linkProgram(program);

  if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
    throw new Error("Shader link error: "+gl.getProgramInfoLog(program));
  }

  gl.deleteShader(vs);
  gl.deleteShader(fs);
  gl.useProgram(program);

  const buffer=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([-1,-1,1,-1,-1,1,1,1]),
    gl.STATIC_DRAW
  );

  const position=gl.getAttribLocation(program,"aPosition");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

  textures=[makeTexture(),makeTexture()];
  gl.uniform1i(gl.getUniformLocation(program,"uBeach"),0);
  gl.uniform1i(gl.getUniformLocation(program,"uGalaxy"),1);
}

function setStatus(message){
  $("status").textContent=message;
}

function formatTime(hour){
  const h=Math.floor(hour)%24;
  const m=Math.floor((hour-Math.floor(hour))*60);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}

function render(now){
  requestAnimationFrame(render);
  if(failed||!gl||!program) return;

  const quality=Number($("quality").value);
  const ratio=Math.min(window.devicePixelRatio||1,quality);
  const width=Math.max(1,Math.floor(innerWidth*ratio));
  const height=Math.max(1,Math.floor(innerHeight*ratio));

  if(canvas.width!==width||canvas.height!==height){
    canvas.width=width;
    canvas.height=height;
  }

  gl.viewport(0,0,width,height);
  gl.useProgram(program);

  const dt=lastTime?Math.min((now-lastTime)/1000,0.1):0;
  lastTime=now;

  if(!$("paused").checked){
    elapsed+=dt*Number($("speed").value);
  }

  const date=new Date();
  const hour=$("realTime").checked
    ? date.getHours()+date.getMinutes()/60+date.getSeconds()/3600
    : (Number($("time").value)+elapsed/3600)%24;

  if($("realTime").checked){
    $("timeLabel").textContent=formatTime(hour);
  }

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,textures[0]);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D,textures[1]);

  const uniform=(name,value)=>gl.uniform1f(gl.getUniformLocation(program,name),value);

  gl.uniform2f(gl.getUniformLocation(program,"uResolution"),width,height);
  uniform("uTime",elapsed);
  uniform("uHour",hour);
  uniform("uStars",Number($("stars").value));
  uniform("uWaves",Number($("waves").value));
  uniform("uPhase",Number($("phase").value));
  uniform("uHasPhotos",photoCount===2?1:0);

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  setStatus("Graphics: WebGL2 OK | "+width+" × "+height+" | Photos: "+photoCount+"/2");
}

function loadImageTexture(index,file){
  return new Promise((resolve,reject)=>{
    const image=new Image();
    const url=URL.createObjectURL(file);

    image.onload=()=>{
      try{
        gl.activeTexture(index===0?gl.TEXTURE0:gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D,textures[index]);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
        URL.revokeObjectURL(url);
        resolve();
      }catch(error){
        URL.revokeObjectURL(url);
        reject(error);
      }
    };

    image.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("Could not load one of the selected images."));
    };

    image.src=url;
  });
}

$("start").addEventListener("click",()=>{
  $("setup").style.display="none";
  setStatus("Scene running.");
});

$("choosePhotos").addEventListener("click",()=>$("photoInput").click());
$("changePhotos").addEventListener("click",()=>$("photoInput").click());

$("photoInput").addEventListener("change",async event=>{
  const files=Array.from(event.target.files||[]).filter(file=>file.type.startsWith("image/"));

  if(files.length<2){
    setStatus("Choose two images: beach first, Milky Way second.");
    return;
  }

  try{
    await loadImageTexture(0,files[0]);
    await loadImageTexture(1,files[1]);
    photoCount=2;
    $("setup").style.display="none";
    setStatus("Both reference photos loaded.");
  }catch(error){
    setStatus("Photo error: "+error.message);
  }

  event.target.value="";
});

$("stars").addEventListener("input",e=>{
  $("starsLabel").textContent=Number(e.target.value).toFixed(1);
});
$("waves").addEventListener("input",e=>{
  $("wavesLabel").textContent=Number(e.target.value).toFixed(1);
});
$("phase").addEventListener("input",e=>{
  $("phaseLabel").textContent=Number(e.target.value).toFixed(2);
});
$("speed").addEventListener("input",e=>{
  $("speedLabel").textContent=Number(e.target.value).toFixed(1)+"×";
});
$("time").addEventListener("input",e=>{
  $("timeLabel").textContent=formatTime(Number(e.target.value));
});

let lastTap=0;
canvas.addEventListener("pointerup",()=>{
  const now=performance.now();
  if(now-lastTap<350){
    $("panel").classList.toggle("open");
  }
  lastTap=now;
});

$("panel").addEventListener("pointerup",event=>event.stopPropagation());

canvas.addEventListener("webglcontextlost",event=>{
  event.preventDefault();
  failed=true;
  setStatus("Graphics context lost. Reload the page.");
});

try{
  init();
  setStatus("Graphics initialized successfully.");
  requestAnimationFrame(render);
}catch(error){
  failed=true;
  $("setup").style.display="block";
  setStatus("Graphics initialization failed: "+error.message);
  console.error(error);
}
})();
</script>
</body>
</html>
