<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="description" content="Eternal Horizon — a real-time procedural ocean horizon with atmospheric sunrise, sunset, clouds, moonlight and a full day-to-night cycle.">
<title>Eternal Horizon — Natural Horizon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<canvas id="scene" aria-label="Procedurally rendered natural ocean horizon with sun, clouds, moon and stars"></canvas>
<div id="loading"><div class="spin"></div><p>Rendering atmosphere…</p></div>
<div id="fatal" hidden role="alert"></div>
<header>
  <div class="brand"><h1>ETERNAL HORIZON</h1><p>Natural horizon · evolving light</p></div>
  <div class="btns"><button id="fsBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button><button id="panelBtn" title="Settings" aria-label="Settings" aria-expanded="true">⚙</button></div>
</header>
<div class="hud"><div id="clock">00:00:00</div><div id="tod">—</div></div>
<aside id="panel">
  <h2>Time</h2>
  <div class="row"><label for="time">Time of day <output id="time_o">06:00</output></label><input id="time" type="range" min="0" max="1439" value="360"></div>
  <div class="grid"><button id="nowBtn">Use device time</button><button id="playBtn" aria-pressed="true">Pause</button></div>
  <div class="row"><label for="speed">Animation speed</label><select id="speed"><option value="1">Real time (1×)</option><option value="60">60× (1 min/s)</option><option value="300">300×</option><option value="900">900× (15 min/s)</option><option value="3600">3600× (1 h/s)</option></select></div>
  <div class="grid"><div class="row"><label for="lat">Latitude °</label><input id="lat" type="number" min="-66" max="66" step="1"></div><div class="row"><label for="date">Date</label><input id="date" type="date"></div></div>
  <h2>Scene</h2>
  <div class="row"><label for="quality">Quality</label><select id="quality"><option value="low">Low</option><option value="balanced">Balanced</option><option value="high">High</option><option value="ultra">Ultra</option></select></div>
  <div class="row"><label for="waves">Wave intensity <output id="waves_o"></output></label><input id="waves" type="range" min="0" max="2" step=".1"></div>
  <div class="row"><label for="clouds">Cloud cover <output id="clouds_o"></output></label><input id="clouds" type="range" min="0" max="1" step=".05"></div>
  <div class="row"><label for="stars">Star density <output id="stars_o"></output></label><input id="stars" type="range" min="0" max="2" step=".1"></div>
  <div class="row"><label for="phase">Moon phase <output id="phase_o"></output></label><input id="phase" type="range" min="0" max=".99" step=".01"></div>
  <label class="chk"><input id="aurora" type="checkbox"> Aurora at night</label>
  <h2>Wallpaper export</h2>
  <div class="grid"><select id="expSize" aria-label="Resolution"><option value="8k">8K · 7680×4320</option><option value="4k">4K · 3840×2160</option><option value="1080">Full HD · 1920×1080</option></select><select id="expFmt" aria-label="Format"><option value="png">PNG</option><option value="jpeg">JPEG</option></select></div>
  <button id="expBtn" class="primary">Export wallpaper at selected time</button>
  <progress id="expBar" max="1" value="0" hidden></progress><p id="expMsg" class="note" aria-live="polite">Renders natively in tiles — not an upscaled screenshot. Falls back to a smaller size if the device runs out of memory.</p>
  <button id="resetBtn">Reset to defaults</button>
</aside>
<div id="toast" role="status"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
